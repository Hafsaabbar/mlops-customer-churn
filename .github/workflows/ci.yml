name: MLOps CI Pipeline

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  test-and-validate:
    name: Test and Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Data Manifest Integrity
        run: |
          python -m src.data.manifest

      - name: Run Pandera Data Validation
        run: |
          python -m src.validation.validate

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ --ignore=tests/api -v --junitxml=reports/junit-test-results.xml

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: reports/junit-test-results.xml

  api-tests:
    name: API Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-api.txt

      - name: Check Environment Consistency
        run: |
          pip check

      - name: Run API Tests Suite
        run: |
          python -m pytest tests/api -v --junitxml=reports/junit-api-results.xml

      - name: Upload API Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: reports/junit-api-results.xml

      - name: Verify No Versioned Files Modified
        run: |
          git diff --exit-code -- artifacts data MANIFEST.json schema.json

  docker-smoke:
    name: Docker Smoke Tests
    needs: [test-and-validate, api-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute Build Metadata
        run: |
          {
            echo "GIT_COMMIT=$(git rev-parse HEAD)"
            echo "MODEL_RUN_ID=$(python -c "import json; print(json.load(open('artifacts/model_metadata.json'))['run_id'])")"
            echo "MODEL_VERSION=$(python -c "import json; print(json.load(open('artifacts/model_metadata.json'))['registry_version'])")"
          } >> "$GITHUB_ENV"

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg GIT_COMMIT \
            --build-arg MODEL_RUN_ID \
            --build-arg MODEL_VERSION \
            -t churn-api:ci .

      - name: Run Nominal Smoke Scenario
        run: |
          docker run -d --name churn-api-ci -p 8000:8000 --health-interval 5s --health-timeout 3s --health-retries 3 --health-start-period 10s churn-api:ci
          python scripts/ci_smoke_test.py nominal --base-url http://127.0.0.1:8000 --container churn-api-ci --image churn-api:ci --commit "${{ env.GIT_COMMIT }}" --report reports/ci/smoke_nominal.json

      - name: Cleanup Nominal Container
        if: always()
        run: |
          docker logs churn-api-ci || true
          docker rm -f churn-api-ci || true

      - name: Run Degraded Smoke Scenario
        run: |
          docker run -d --name churn-api-ci-degraded -p 8000:8000 --health-interval 5s --health-timeout 3s --health-retries 3 --health-start-period 10s -e METADATA_PATH=/app/absent.json churn-api:ci
          python scripts/ci_smoke_test.py degraded --base-url http://127.0.0.1:8000 --container churn-api-ci-degraded --report reports/ci/smoke_degraded.json

      - name: Cleanup Degraded Container
        if: always()
        run: |
          docker logs churn-api-ci-degraded || true
          docker rm -f churn-api-ci-degraded || true

      - name: Upload Smoke Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports
          path: reports/ci/*.json

  monitoring-config:
    name: Monitoring Config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Prometheus Image Tag
        run: |
          PROM_IMAGE=$(grep -E 'image:\s*prom/prometheus:' docker-compose.yml | awk '{print $2}')
          echo "PROMETHEUS_IMAGE=${PROM_IMAGE}" >> "$GITHUB_ENV"

      - name: Validate Prometheus Configuration and Rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "${PWD}/monitoring/prometheus:/cfg:ro" \
            -w /cfg \
            "${{ env.PROMETHEUS_IMAGE }}" check config /cfg/prometheus.yml
          docker run --rm --entrypoint promtool \
            -v "${PWD}/monitoring/prometheus:/cfg:ro" \
            -w /cfg \
            "${{ env.PROMETHEUS_IMAGE }}" check rules /cfg/alerts.yml
          docker run --rm --entrypoint promtool \
            -v "${PWD}/monitoring/prometheus:/cfg:ro" \
            -w /cfg \
            "${{ env.PROMETHEUS_IMAGE }}" test rules /cfg/alerts_test.yml

      - name: Validate Grafana Dashboard JSON
        run: |
          python3 -m json.tool monitoring/grafana/dashboards/churn-api.json > /dev/null

      - name: Validate Docker Compose Monitoring Profile
        run: |
          docker compose --profile monitoring config -q
