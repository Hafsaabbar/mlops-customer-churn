name: MLOps Part A - CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-api.txt

      - name: Verify Data Manifest Integrity
        run: |
          python -m src.data.manifest

      - name: Run Pandera Data Validation
        run: |
          python -m src.validation.validate

      - name: Run Full Pytest Test Suite
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: |
          pytest tests/ -v --junitxml=reports/junit-test-results.xml

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: reports/junit-test-results.xml

